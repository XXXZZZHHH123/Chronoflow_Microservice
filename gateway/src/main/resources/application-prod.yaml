spring:
  cloud:
    nacos:
      server-addr: ${PROD_NACOS_HOST}:${PROD_NACOS_PORT} # Nacos host
      username: ${PROD_NACOS_USERNAME} # Nacos username
      password: ${PROD_NACOS_PASSWORD} # Nacos password
      discovery:
        namespace: prod
        group: DEFAULT_GROUP
      config:
        namespace: prod
        group: DEFAULT_GROUP

  # Redis config
  data:
    redis:
      host: ${PROD_REDIS_HOST}
      port: ${PROD_REDIS_PORT}
      database: ${PROD_REDIS_DATABASE}
      password: ${PROD_REDIS_PASSWORD}