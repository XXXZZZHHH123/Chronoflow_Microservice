spring:
  cloud:
    nacos:
      server-addr: ${TEST_NACOS_HOST}:${TEST_NACOS_PORT} # Nacos host
      username: ${TEST_NACOS_USERNAME} # Nacos username
      password: ${TEST_NACOS_PASSWORD} # Nacos password
      discovery:
        namespace: test
        group: DEFAULT_GROUP
      config:
        namespace: test
        group: DEFAULT_GROUP

  # Redis config
  data:
    redis:
      host: ${TEST_REDIS_HOST}
      port: ${TEST_REDIS_PORT}
      database: ${TEST_REDIS_DATABASE}
      password: ${TEST_REDIS_PASSWORD}