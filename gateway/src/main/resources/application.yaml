server:
  port: 8080

spring:
  application:
    name: gateway
  profiles:
    active: dev
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yaml # Load【dev】config
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml # Load【Nacos】config

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      routes:
        # User Service
        - id: user
          uri: lb://user-service
          predicates:
            - Path=/user/**
          filters:
            - RewritePath=/user/v3/api-docs, /v3/api-docs
        # Event Service
        - id: event
          uri: lb://event-service
          predicates:
            - Path=/event/**
          filters:
            - RewritePath=/event/v3/api-docs, /v3/api-docs
        # Task Service
        - id: task
          uri: lb://task-service
          predicates:
            - Path=/task/**
          filters:
            - RewritePath=/task/v3/api-docs, /v3/api-docs
        # Attendee Service
        - id: attendee
          uri: lb://attendee-service
          predicates:
            - Path=/attendee/**
          filters:
            - RewritePath=/attendee/v3/api-docs, /v3/api-docs
        # File Service
        - id: file
          uri: lb://file-service
          predicates:
            - Path=/file/**
          filters:
            - RewritePath=/file/v3/api-docs, /v3/api-docs
        # Notification Service
        - id: notification
          uri: lb://notification-service
          predicates:
            - Path=/notification/**
          filters:
            - RewritePath=/notification/v3/api-docs, /v3/api-docs
      x-forwarded:
        prefix-enabled: false

knife4j:
  # Integrate Swagger docs，refer https://doc.xiaominfo.com/docs/action/springcloud-gateway
  gateway:
    enabled: true
    routes:
      - name: user-service
        service-name: user-service
        url: /user/v3/api-docs
      - name: event-service
        service-name: event-service
        url: /event/v3/api-docs
      - name: task-service
        service-name: task-service
        url: /task/v3/api-docs
      - name: attendee-service
        service-name: attendee-service
        url: /attendee/v3/api-docs
      - name: file-service
        service-name: file-service
        url: /file/v3/api-docs
      - name: notification-service
        service-name: notification-service
        url: /notification/v3/api-docs

gateway:
  white-list:
    - /user/auth/login
    - /user/auth/refresh
    - /user/reg/**