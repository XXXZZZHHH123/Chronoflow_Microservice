name: Microservices CI/CD

on:
  push:
    branches:
      - main
      - dev
      - cicd
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  packages: write

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: asia-southeast2

jobs:
  # Detect changed services
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      all-services: ${{ steps.set-services.outputs.all }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            user-service:
              - 'user-service/**'
            task-service:
              - 'task-service/**'
            notification-service:
              - 'notification-service/**'
            gateway:
              - 'gateway/**'
            file-service:
              - 'file-service/**'
            event-service:
              - 'event-service/**'
            attendee-service:
              - 'event-service/**'

      - name: Set all services list
        id: set-services
        run: |
          echo "all=[\"user-service\",\"task-service\",\"notification-service\",\"gateway\", \"file-service\", \"event-service\", \"attendee-service\"]" >> $GITHUB_OUTPUT

  build-and-test:
    name: Build & Test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Lint (Spotless + Checkstyle) for ${{ matrix.service }}
        run: mvn -B -pl ${{ matrix.service }} -am spotless:check checkstyle:check

      - name: Build & Run tests for ${{ matrix.service }}
        run: mvn -B -pl ${{ matrix.service }} -am clean verify

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ./${{ matrix.service }}/target/*.jar
          retention-days: 1

  sca-sbom:
    name: SCA & SBOM - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    if: needs.detect-changes.outputs.services != '[]'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Build (skip tests) for ${{ matrix.service }}
        run: mvn -B -pl ${{ matrix.service }} -am clean package -DskipTests

      - name: Set report filenames
        run: |
          echo "SBOM_FILE=${{ matrix.service }}-sbom.cdx.json" >> $GITHUB_ENV
          echo "SARIF_REPORT=${{ matrix.service }}-grype-report.sarif" >> $GITHUB_ENV
          echo "TABLE_REPORT=${{ matrix.service }}-grype-report.txt" >> $GITHUB_ENV

      - name: Generate SBOM (CycloneDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: ./${{ matrix.service }}
          format: cyclonedx-json
          output-file: ${{ env.SBOM_FILE }}

      - name: SCA via Anchore (SARIF)
        uses: anchore/scan-action@v6
        with:
          sbom: ${{ env.SBOM_FILE }}
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
          output-file: ${{ env.SARIF_REPORT }}

      - name: SCA via Anchore (table)
        uses: anchore/scan-action@v6
        with:
          sbom: ${{ env.SBOM_FILE }}
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          output-format: table
          output-file: ${{ env.TABLE_REPORT }}

      - name: Upload SBOM & SCA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-sca-${{ matrix.service }}
          path: |
            ${{ env.SBOM_FILE }}
            ${{ env.SARIF_REPORT }}
            ${{ env.TABLE_REPORT }}
          retention-days: 5

  sonar-scan:
    name: Sonar Scan - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.ref == 'refs/heads/cicd'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.all-services) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: |
          mvn -B -pl ${{ matrix.service }} -am clean verify org.sonarsource.scanner.maven:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}"

  build-and-push-docker:
    name: Docker Build & Push - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    if: |
      needs.detect-changes.outputs.services != '[]' && 
      (github.ref == 'refs/heads/main' || 
       github.ref == 'refs/heads/dev')
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: ./${{ matrix.service }}/target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.service }}:buildcache,mode=max

  deploy-to-gke:
    name: Deploy to GKE - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push-docker]
    if: |
      needs.detect-changes.outputs.services != '[]' && 
      github.ref == 'refs/heads/main' &&
      vars.USE_GKE == 'true'
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      - name: Configure kubectl plugin
        run: |
          echo "USE_GKE_GCLOUD_AUTH_PLUGIN=True" >> $GITHUB_ENV

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Verify kubectl connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Prepare Kubernetes manifests
        run: |
          IMAGE_TAG="${{ github.ref_name }}-${{ github.sha }}"
          IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.service }}:$IMAGE_TAG"

          if [ ! -f "k8s/${{ matrix.service }}/deployment.yaml" ]; then
          echo "⚠️ Kubernetes manifest 不存在: k8s/${{ matrix.service }}/deployment.yaml"
          echo "使用 kubectl set image 方式更新..."
          echo "USE_MANIFEST=false" >> $GITHUB_ENV
          else
          echo "✅ 找到 Kubernetes manifest"
          echo "USE_MANIFEST=true" >> $GITHUB_ENV
          
          mkdir -p /tmp/k8s/${{ matrix.service }}
          
          cp k8s/${{ matrix.service }}/*.yaml /tmp/k8s/${{ matrix.service }}/
          sed -i "s|DOCKER_HUB_USERNAME/${{ matrix.service }}:latest|$IMAGE|g" /tmp/k8s/${{ matrix.service }}/deployment.yaml
          fi

      - name: Deploy to GKE (using manifests)
        if: env.USE_MANIFEST == 'true'
        run: |
          kubectl apply -f /tmp/k8s/${{ matrix.service }}/ -n microservices
          
      - name: Deploy to GKE (using set image)
        if: env.USE_MANIFEST == 'false'
        run: |
          echo "🚀 使用 kubectl set image 部署 ${{ matrix.service }}..."
          IMAGE_TAG="${{ github.ref_name }}-${{ github.sha }}"
          IMAGE="${{ secrets.DOCKER_HUB_USERNAME }}/${{ matrix.service }}:$IMAGE_TAG"
          
          # 检查 deployment 是否存在
          if kubectl get deployment ${{ matrix.service }} -n microservices &> /dev/null; then
          echo "更新现有 Deployment..."
          kubectl set image deployment/${{ matrix.service }} \
           ${{ matrix.service }}=$IMAGE \
           -n microservices
          else
          echo "⚠️ Deployment 不存在，请先创建 Kubernetes manifests 或手动创建 Deployment"
          exit 1
          fi

      - name: Wait for rollout to complete
        run: |
          echo "⏳ 等待部署完成..."
          kubectl rollout status deployment/${{ matrix.service }} \
          -n microservices \
          --timeout=5m

      - name: Verify deployment
        run: |
          echo "✅ 部署状态:"
          kubectl get deployment ${{ matrix.service }} -n microservices
          echo ""
          echo "📊 Pod 状态:"
          kubectl get pods -n microservices -l app=${{ matrix.service }}
          echo ""
          echo "🔗 Service 信息:"
          kubectl get service ${{ matrix.service }} -n microservices 2>/dev/null || echo "Service 未配置"
          echo ""
          echo "📝 最近事件:"
          kubectl get events -n microservices \
            --field-selector involvedObject.name=${{ matrix.service }} \
            --sort-by='.lastTimestamp' \
            | tail -10
