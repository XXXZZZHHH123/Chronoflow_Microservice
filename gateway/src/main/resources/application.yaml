server:
  port: 8080

spring:
  application:
    name: gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yaml # Load【dev】config
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml # Load【Nacos】config

  # Redis config
  data:
    redis:
      repositories:
        enabled: false
      lettuce:
        pool:
          # Maximum number of connections in the connection pool
          max-active: 200
          # The maximum blocking wait time of the connection pool (a negative value indicates no limit)
          max-wait: -1ms
          # Maximum idle connections in the connection pool
          max-idle: 10
          # Minimum number of idle connections in the connection pool
          min-idle: 0

  cloud:
    nacos:
      discovery:
        server-addr: ${DEV_NACOS_HOST}:${DEV_NACOS_PORT}
    gateway:
      routes:
        # User Service
        - id: user
          uri: lb://user-service
          predicates:
            - Path=/user/**
          filters:
            - RewritePath=/user/v3/api-docs, /v3/api-docs
        # Event Service
        - id: event
          uri: lb://event-service
          predicates:
            - Path=/event/**
          filters:
            - RewritePath=/event/v3/api-docs, /v3/api-docs
        # Task Service
        - id: task
          uri: lb://task-service
          predicates:
            - Path=/task/**
          filters:
            - RewritePath=/task/v3/api-docs, /v3/api-docs
        # Attendee Service
        - id: attendee
          uri: lb://attendee-service
          predicates:
            - Path=/attendee/**
          filters:
            - RewritePath=/attendee/v3/api-docs, /v3/api-docs
        # File Service
        - id: file
          uri: lb://file-service
          predicates:
            - Path=/file/**
          filters:
            - RewritePath=/file/v3/api-docs, /v3/api-docs
        # Notification Service
        - id: notification
          uri: lb://notification-service
          predicates:
            - Path=/notification/**
          filters:
            - RewritePath=/notification/v3/api-docs, /v3/api-docs
      x-forwarded:
        prefix-enabled: false

knife4j:
  # Integrate Swagger docs，refer https://doc.xiaominfo.com/docs/action/springcloud-gateway
  gateway:
    enabled: true
    routes:
      - name: user-service
        service-name: user-service
        url: /user/v3/api-docs
      - name: event-service
        service-name: event-service
        url: /event/v3/api-docs
      - name: task-service
        service-name: task-service
        url: /task/v3/api-docs
      - name: attendee-service
        service-name: attendee-service
        url: /attendee/v3/api-docs
      - name: file-service
        service-name: file-service
        url: /file/v3/api-docs
      - name: notification-service
        service-name: notification-service
        url: /notification/v3/api-docs

gateway:
  white-list:
    - /user/auth/login
    - /user/auth/refresh
    - /user/reg/**

############## Sa-Token config (文档: https://sa-token.cc) ##############
sa-token:
  # token name
  token-name: Authorization
  # token validity period (unit: seconds) The default is 30 days, -1 means permanent validity
  timeout: 86400
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  # Minimum active frequency (unit: seconds). If the token does not access the system within this time,
  # it will be frozen. The default value of -1 means no limit and never freeze.
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  # Whether to allow multiple logins from the same account at the same time
  # (if true, multiple logins are allowed; if false, new logins will replace old logins)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  # When multiple people log into the same account, do they share a token?
  # (If true, all logins share a token; if false, a new token is created for each login.)
  is-share: true
  # Whether to output operation logs
  is-log: true
  # Token style
  token-style: uuid
  cookie:
    http-only: true