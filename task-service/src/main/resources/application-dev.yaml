
spring:
  application:
    name: task-service
  cloud:
    nacos:
      server-addr: ${DEV_NACOS_HOST}:${DEV_NACOS_PORT} # Nacos host
      username: ${DEV_NACOS_USERNAME} # Nacos username
      password: ${DEV_NACOS_PASSWORD} # Nacos password
      discovery:
        namespace: dev
        group: DEFAULT_GROUP
      config:
        namespace: dev
        group: DEFAULT_GROUP
  autoconfigure:
    exclude:
  datasource:
    druid:
      web-stat-filter:
        enabled: true
      stat-view-servlet:
        enabled: true
        allow:
        url-pattern: /druid/*
        login-username: lushuwen
        login-password: lushuwen
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 100
          merge-sql: true
        wall:
          config:
            multi-statement-allow: true
    dynamic:
      druid:
        initial-size: 5
        min-idle: 10
        max-active: 20
        max-wait: 600000
        time-between-eviction-runs-millis: 60000
        min-evictable-idle-time-millis: 300000
        max-evictable-idle-time-millis: 900000
        validation-query: SELECT 1 FROM DUAL
        test-while-idle: true
        test-on-borrow: false
        test-on-return: false
      primary: master
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${DEV_MASTER_DB_HOST}:${DEV_MASTER_DB_PORT}/task?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
          username: ${DEV_MASTER_DB_USER}
          password: ${DEV_MASTER_DB_PASSWORD}
        slave:
          driver-class-name: com.mysql.cj.jdbc.Driver
          lazy: true # Enable lazy loading to ensure startup speed
          url: jdbc:mysql://${DEV_SLAVE_DB_HOST}:${DEV_SLAVE_DB_PORT}/task?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
          username: ${DEV_SLAVE_DB_USER}
          password: ${DEV_SLAVE_DB_PASSWORD}
  data:
    redis:
      host: ${DEV_REDIS_HOST}
      port: ${DEV_REDIS_PORT}
      database: ${DEV_REDIS_DATABASE}
      password: ${DEV_REDIS_PASSWORD}

# Dubbo config
dubbo:
  registry:
    address: nacos://${DEV_NACOS_HOST}:${DEV_NACOS_PORT}?username=${DEV_NACOS_USERNAME}&password=${DEV_NACOS_PASSWORD}
    # This will enable application-level service discovery only (the recommended service discovery method for Dubbo3).
    # For users upgrading from Dubbo2.x, please set the value to 'all' for smooth migration.
    register-mode: instance
    parameters:
      namespace: dev
  protocol:
    name: tri
    port: 50052
  application:
    name: task-service-rpc
    logger: slf4j

# Lock4j config
lock4j:
  acquire-timeout: 3000 # Get distributed lock timeout, the default is 3000 milliseconds
  expire: 30000 # Distributed lock timeout, default is 30 milliseconds

# log config
logging:
  level:
    nus.edu.u: info
    org.springframework: warn
